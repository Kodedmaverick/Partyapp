services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://party.kylodo.com}
      HOST_PASSWORD: ${HOST_PASSWORD:?set HOST_PASSWORD}
      DATABASE_URL: file:/data/htbt.sqlite
      TRUST_PROXY: "true"
    volumes:
      - htbt-data:/data
    expose:
      - "3000"
volumes:
  htbt-data:
